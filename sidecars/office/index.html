<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGY Studio</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      color-scheme: dark light;
      --background: #0b0f17;
      --content: #111723;
      --card: #151c2a;
      --card-border: #222c3f;
      --border: #2a364d;
      --foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #090d16;
      --secondary: #1e293b;
      --secondary-foreground: #e2e8f0;
      --accent: #263449;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      background: none;
      border: none;
      color: inherit;
      padding: 0;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .panel-flush { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .row-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .row-center { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .divider-top { border-top: 1px solid var(--card-border); padding-top: 8px; }
    .title { font-weight: 600; font-size: 14px; color: var(--foreground); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted-foreground); }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--content);
      border: 1px solid var(--card-border);
      color: var(--muted-foreground);
      white-space: nowrap;
    }
    .seg-group {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 8px;
      background: var(--secondary);
      border: 1px solid var(--border);
    }
    .seg-btn {
      padding: 4px 9px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 12px;
      color: var(--muted-foreground);
      transition: background 0.15s, color 0.15s;
    }
    .seg-btn.active {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .ops-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    @media (min-width: 460px) {
      .ops-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .ops-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--content);
      border: 1px solid var(--card-border);
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
    .filter-nav { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-tab {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      color: var(--muted-foreground);
    }
    .filter-tab.active {
      background: var(--secondary);
      color: var(--foreground);
      border-color: var(--primary);
    }
    .floor-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--background);
      overflow: hidden;
    }
    .floor-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 12px;
      background: var(--content);
      border-bottom: 1px solid var(--card-border);
      font-size: 12px;
    }
    .floor-code {
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--secondary);
      color: var(--foreground);
      font-size: 11px;
    }
    .desks-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      padding: 10px;
    }
    @media (min-width: 440px) {
      .desks-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .desk-card {
      width: 100%;
      text-align: left;
      border-radius: 10px;
      padding: 9px;
      border: 1px solid var(--card-border);
      background: var(--content);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .desk-card:hover { border-color: var(--border); }
    .desk-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
      background: var(--secondary);
    }
    .desk-svg {
      width: 92px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--background);
      border: 1px solid var(--card-border);
    }
    .desk-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--foreground);
      flex-shrink: 0;
    }
    .sub-box {
      border-radius: 8px;
      background: var(--content);
      border: 1px solid var(--card-border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .feed-item {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--content);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .feed-item.selected {
      border-color: var(--primary);
      background: var(--secondary);
    }
    .branch-box {
      padding-left: 12px;
      border-left: 2px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-action {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
    }
    .btn-action.primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    .hidden { display: none !important; }
    @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes screenFlicker { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.65; } }
    @keyframes steamRise { 0%, 100% { transform: translateY(0px); opacity: 0.85; } 50% { transform: translateY(-2px); opacity: 0.35; } }
    .pulse-soft { animation: pulseSoft 1.8s ease-in-out infinite; }
    .screen-live { animation: screenFlicker 1.4s steps(2, end) infinite; }
    .steam-live { animation: steamRise 1.8s steps(2, end) infinite; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 1. TOP HEADER -->
    <header class="panel">
      <div class="row-between">
        <div class="row-center">
          <span id="live-indicator" class="dot pulse-soft" style="background: var(--success);"></span>
          <span class="title">AGY Studio</span>
          <span id="mode-pill" class="badge mono">LIVE</span>
        </div>

        <div class="row-center" style="gap: 6px; flex-wrap: wrap;">
          <div class="seg-group" title="Scope">
            <button id="btn-scope-current" type="button" class="seg-btn active">This Chat</button>
            <button id="btn-scope-all" type="button" class="seg-btn">All</button>
          </div>
          <div class="seg-group">
            <button id="btn-view-studio" type="button" class="seg-btn active">Studio</button>
            <button id="btn-view-map" type="button" class="seg-btn">Map</button>
          </div>
          <div class="seg-group" title="Language">
            <button id="btn-lang-en" type="button" class="seg-btn">EN</button>
            <button id="btn-lang-tr" type="button" class="seg-btn">TR</button>
          </div>
        </div>
      </div>

      <!-- Status Overview -->
      <div class="ops-grid divider-top">
        <div class="ops-box">
          <span class="row-center muted"><span class="dot" style="background: var(--success);"></span><span id="lbl-exec">Code / Test</span></span>
          <span id="count-exec" class="mono" style="font-weight:600;">0</span>
        </div>
        <div class="ops-box">
          <span class="row-center muted"><span class="dot" style="background: var(--primary);"></span><span id="lbl-plan">Plan / Review</span></span>
          <span id="count-plan" class="mono" style="font-weight:600;">0</span>
        </div>
        <div class="ops-box">
          <span class="row-center muted"><span class="dot" style="background: var(--warning);"></span><span id="lbl-handoff">Handed off</span></span>
          <span id="count-handoff" class="mono" style="font-weight:600;">0</span>
        </div>
        <div class="ops-box">
          <span class="row-center muted"><span class="dot" style="background: var(--muted-foreground);"></span><span id="lbl-idle">Idle</span></span>
          <span id="count-idle" class="mono" style="font-weight:600;">0</span>
        </div>
      </div>

      <!-- Category Filters -->
      <nav id="filter-bar" class="filter-nav divider-top">
        <button type="button" data-filter="all" class="filter-tab active">All</button>
        <button type="button" data-filter="orchestrator" class="filter-tab">Orchestrator</button>
        <button type="button" data-filter="swarm" class="filter-tab">Swarm</button>
        <button type="button" data-filter="cli" class="filter-tab">External CLI</button>
        <button type="button" data-filter="idle" class="filter-tab">Idle</button>
      </nav>
    </header>

    <!-- 2. MAIN STAGE -->
    <main class="panel">
      <div id="studio-view" style="display:flex; flex-direction:column; gap:10px;"></div>
      <div id="map-view" class="hidden" style="display:flex; flex-direction:column; gap:10px;"></div>
    </main>

    <!-- 3. BOTTOM PANEL -->
    <section class="panel-flush">
      <div class="row-between" style="padding: 8px 12px; background: var(--content); border-bottom: 1px solid var(--card-border);">
        <div class="row-center" style="gap: 4px;">
          <button id="tab-selected" type="button" class="seg-btn active">Selected Agent</button>
          <button id="tab-feed" type="button" class="seg-btn">Live Feed</button>
        </div>
        <span id="total-tokens-badge" class="mono muted" style="font-size: 12px;">Total: —</span>
      </div>

      <!-- Tab 1: Selected Agent -->
      <div id="panel-selected" style="padding: 12px; display:flex; flex-direction:column; gap:10px;">
        <div class="row-between">
          <div class="row-center">
            <span id="insp-dot" class="dot" style="background: var(--primary);"></span>
            <span id="insp-name" class="title truncate">-</span>
            <span id="insp-status-badge" class="badge">-</span>
            <span id="insp-provider" class="badge">-</span>
          </div>
          <div class="row-center">
            <span class="mono muted" style="font-size: 12px;">
              <span id="insp-tokens">—</span> · <span id="insp-elapsed">0s</span>
            </span>
            <button id="btn-jump-conv" type="button" class="btn-action primary hidden">Jump to Chat</button>
          </div>
        </div>

        <div class="sub-box">
          <div class="row-between" style="font-size: 12px;">
            <span id="lbl-what-doing" class="muted" style="font-weight: 500;">Current activity</span>
            <span id="insp-ownership" class="mono muted">-</span>
          </div>
          <div id="insp-human-summary" style="font-weight: 600; font-size: 13px;">-</div>
          <div id="insp-tech-task" class="mono muted" style="font-size: 12px; word-break: break-all;">-</div>
        </div>

        <div class="sub-box">
          <div id="lbl-thinking" class="muted" style="font-size: 12px; font-weight: 500;">Reasoning &amp; Context</div>
          <div id="insp-thinking" style="font-size: 12px;">-</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:4px;">
          <div id="lbl-recent-steps" class="muted" style="font-size: 12px; font-weight: 500;">Recent steps</div>
          <div id="insp-history" style="display:flex; flex-direction:column; gap:4px;"></div>
        </div>
      </div>

      <!-- Tab 2: Live Event Feed -->
      <div id="panel-feed" class="hidden" style="padding: 12px; display:flex; flex-direction:column; gap:6px;">
        <div class="row-between muted" style="font-size: 12px;">
          <span id="lbl-feed-title">Recent actions across agents</span>
          <span id="lbl-feed-hint">Click a row to inspect</span>
        </div>
        <div id="live-feed" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </section>

    <!-- 4. DATA SOURCE & DEMO DRAWER -->
    <details class="sub-box" style="border-style: dashed;">
      <summary class="row-between muted" style="cursor: pointer; user-select: none; font-size: 12px; font-weight: 500;">
        <span id="lbl-drawer-title">Data Source &amp; Demo Tools</span>
        <span id="demo-status-label" class="mono">Live JSONL connected</span>
      </summary>
      <div class="row-center divider-top" style="flex-wrap: wrap; margin-top: 8px;">
        <button id="cmd-toggle-source" type="button" class="btn-action primary">Switch to Demo</button>
        <button id="cmd-refresh-now" type="button" class="btn-action">Refresh Now</button>
        <button id="cmd-swarm" type="button" class="btn-action hidden">+6 Swarm Workers</button>
      </div>
    </details>

  </div>

        if (m >= 60) {

        if (unassigned.length > 0) {
          idleHtml = `
            <div class="sub-box" style="gap:8px;">
              <div class="muted" style="font-weight:600;">${d.mapOther(unassigned.length)}</div>
              <div class="desks-grid" style="padding:0;">
                ${unassigned.map((u) => `
                  <button type="button" data-agent-id="${u.id}" class="desk-card ${state.selectedId === u.id ? 'selected' : ''}" style="flex-direction:column; align-items:stretch; gap:4px;">
                    <div class="row-between">
                      <span class="truncate" style="font-weight:600;">${u.name}</span>
                      <span class="muted">${u.humanStatus}</span>
                    </div>
                    <div class="muted truncate">${u.humanSummary}</div>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }

        elMapView.innerHTML = (groupsHtml + idleHtml) || `<div class="muted" style="text-align:center; padding:24px 0;">${d.noAgentsFilter}</div>`;
        bindAgentClicks(elMapView);
      }

      function bindAgentClicks(container) {
        container.querySelectorAll('[data-agent-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.selectedId = btn.dataset.agentId;
            renderAll();
          });
        });
      }

      function getVisibleFeedItems() {
        const visibleIds = new Set(getFilteredAgents().map((a) => a.id));
        return state.feed.filter((f) => visibleIds.has(f.agentId)).slice(0, 8);
      }

      function renderInspector() {
        const d = t();
        let agent = state.agents.find((a) => a.id === state.selectedId);
        if (!agent) {
          agent = state.agents[0];
          if (agent) state.selectedId = agent.id;
        }
        if (!agent) return;

        elInspDot.style.background = stateDotVar(agent.stateKind);
        elInspName.textContent = `${agent.name} (${agent.modelBadge})`;
        elInspStatusBadge.textContent = agent.humanStatus;
        elInspProvider.textContent = agent.providerLabel;
        elInspTokens.textContent = fmtTokens(agent.tokens);
        elInspElapsed.textContent = fmtElapsed(agent.elapsedSec);
        elInspOwnership.textContent = agent.parentName
          ? d.linkedTo(agent.parentName, agent.role)
          : `${d.rolePrefix}: ${agent.role}`;
        elInspHumanSummary.textContent = agent.humanSummary;
        elInspTechTask.textContent = `${d.cmdPrefix}: ${agent.tool} → ${agent.target}`;
        elInspThinking.textContent = agent.thinking;

        const canJump = Boolean(agent.conversationId && window.sidecar?.ui?.toggleConversation);
        elBtnJumpConv.classList.toggle('hidden', !canJump);
        elBtnJumpConv.onclick = () => {
          if (agent.conversationId && window.sidecar?.ui?.toggleConversation) {
            window.sidecar.ui.toggleConversation(agent.conversationId);
          }
        };

        elInspHistory.innerHTML = (agent.history || []).slice().reverse().slice(0, 3).map((h) => `
          <div class="row-between sub-box" style="padding: 6px 8px; flex-direction:row;">
            <span class="truncate">${h.summary} <span class="mono muted">(${h.tech || ''})</span></span>
            <span class="mono muted" style="flex-shrink:0;">${h.time}</span>
          </div>
        `).join('');
      }

      function renderFeed() {
        const d = t();
        const items = getVisibleFeedItems();
        if (items.length === 0) {
          elLiveFeed.innerHTML = `<div class="muted" style="padding:8px 0;">${d.noEventsFilter}</div>`;
          return;
        }
        elLiveFeed.innerHTML = items.map((item) => {
          const isSel = item.agentId === state.selectedId;
          const dotColor = stateDotVar(item.stateKind);
          return `
            <button type="button" data-agent-id="${item.agentId}" class="feed-item ${isSel ? 'selected' : ''}">
              <div class="row-between">
                <span class="row-center" style="font-weight:600;">
                  <span class="dot" style="background:${dotColor};"></span>${item.agentName}
                </span>
                <span class="mono muted">${item.time}</span>
              </div>
              <div class="truncate">${item.summary}</div>
              <div class="mono muted truncate" style="font-size:11.5px;">${item.tech || ''}</div>
            </button>
          `;
        }).join('');

        elLiveFeed.querySelectorAll('[data-agent-id]').forEach((el) => {
          el.addEventListener('click', () => {
            state.bottomTab = 'selected';
            state.selectedId = el.dataset.agentId;
            renderAll();
          });
        });
      }

      function renderAll() {
        renderHeader();
        if (state.view === 'studio') renderStudioView();
        else renderMapView();
        renderInspector();
        renderFeed();
      }

      async function pollLiveState(force) {
        if (state.mode !== 'live') return;
        try {
          const params = new URLSearchParams(window.location.search);
          const convId = params.get('conversationId') || '';
          const token = params.get('token') || '';
          const qs = new URLSearchParams();
          qs.set('scope', state.scope);
          qs.set('lang', state.lang);
          if (convId) qs.set('conversationId', convId);
          if (token) qs.set('token', token);
          if (!force && state.etag) qs.set('etag', state.etag);

          const headers = {};
          if (token) headers['x-sidecar-token'] = token;

          const res = await fetch(`/api/state?${qs.toString()}`, { cache: 'no-store', headers });
          if (!res.ok) return;
          const data = await res.json();
          if (data.unchanged) return;

          state.etag = data.etag || '';
          state.leadOrchId = data.leadOrchId || null;
          state.agents = Array.isArray(data.agents) ? data.agents : [];
          state.feed = Array.isArray(data.feed) ? data.feed : [];
          if (!state.selectedId || !state.agents.some((a) => a.id === state.selectedId)) {
            state.selectedId = state.leadOrchId || (state.agents[0]?.id ?? null);
          }
          renderAll();
        } catch {}
      }

      function loadDemoMode() {
        state.mode = 'demo';
        state.leadOrchId = 'orch-argon';
        state.agents = DEMO_AGENTS.map((a) => ({ ...a, history: [...a.history] }));
        if (state.demoSwarmSpawned) {
          EXTRA_DEMO_SWARM.forEach((s) => state.agents.push({ ...s }));
        }
        state.feed = [
          { time: '14:52:27', agentId: 'cli-copilot', agentName: 'GitHub Copilot CLI', stateKind: 'plan', summary: 'Auditing XSS & router edge cases', tech: 'security_audit → share_modal.ts' },
          { time: '14:52:25', agentId: 'cli-codex', agentName: 'OpenAI Codex CLI', stateKind: 'exec', summary: 'Patching API concurrency lock', tech: 'apply_patch → refresh_mutex.ts' },
          { time: '14:52:18', agentId: 'cli-opencode', agentName: 'OpenCode CLI', stateKind: 'exec', summary: 'Refactoring widget tests', tech: 'opencode → router_test.dart' },
          { time: '14:52:12', agentId: 'exec-hydro', agentName: 'Hydrogen · Exec', stateKind: 'exec', summary: 'Adding transactional refresh token lock', tech: 'edit_file → session_repo.dart' }
        ];
        state.selectedId = 'orch-argon';
        renderAll();
      }

      function setLang(nextLang) {
        if (state.lang === nextLang) return;
        state.lang = nextLang;
        try { localStorage.setItem('agy_studio_lang', nextLang); } catch {}
        state.etag = '';
        renderAll();
        if (state.mode === 'live') pollLiveState(true);
      }

      elBtnLangEn.addEventListener('click', () => setLang('en'));
      elBtnLangTr.addEventListener('click', () => setLang('tr'));

      elBtnScopeCurrent.addEventListener('click', () => {
        if (state.scope === 'current') return;
        state.scope = 'current';
        state.etag = '';
        state.selectedId = null;
        renderHeader();
        if (state.mode === 'live') pollLiveState(true);
      });
      elBtnScopeAll.addEventListener('click', () => {
        if (state.scope === 'all') return;
        state.scope = 'all';
        state.etag = '';
        renderHeader();
        if (state.mode === 'live') pollLiveState(true);
      });
      elBtnStudio.addEventListener('click', () => { state.view = 'studio'; renderAll(); });
      elBtnMap.addEventListener('click', () => { state.view = 'map'; renderAll(); });
      elTabSelected.addEventListener('click', () => { state.bottomTab = 'selected'; renderHeader(); });
      elTabFeed.addEventListener('click', () => { state.bottomTab = 'feed'; renderHeader(); });

      document.querySelectorAll('.filter-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.filter = btn.dataset.filter;
          renderAll();
        });
      });

      elCmdToggleSource.addEventListener('click', () => {
        if (state.mode === 'live') loadDemoMode();
        else {
          state.mode = 'live';
          state.etag = '';
          pollLiveState(true);
        }
      });

      elCmdRefreshNow.addEventListener('click', () => {
        if (state.mode === 'live') pollLiveState(true);
        else renderAll();
      });

      elCmdSwarm.addEventListener('click', () => {
        if (state.mode !== 'demo') return;
        state.demoSwarmSpawned = !state.demoSwarmSpawned;
        loadDemoMode();
      });

      setInterval(() => pollLiveState(false), 1800);
      pollLiveState(true);
    })();
  </script>
</body>
</html>
